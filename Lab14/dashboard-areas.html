<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Dashboard</title>
    <style>
        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 10px;
        }

        .header {
            grid-area: header;
            background-color: #1d3557;
            color: white;
            padding: 20px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: lightblue;
            padding: 20px;
        }

        .main {
            grid-area: main;
            background-color: lightgreen;
            padding: 20px;
            min-height: 150px;
        }

        .footer {
            grid-area: footer;
            background-color: #1d3557;
            color: white;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>CSS Grid Dashboard</h1>

    <div class="dashboard">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main Content</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
