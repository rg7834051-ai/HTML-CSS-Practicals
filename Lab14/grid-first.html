<!DOCTYPE html>
<html>
<head>
    <title>Basic CSS Grid</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .box {
            background-color: lightblue;
            border: 2px solid #1d3557;
            padding: 30px;
            text-align: center;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>Basic CSS Grid Layout</h1>

    <div class="grid-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</body>
</html>
