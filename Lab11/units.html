<!DOCTYPE html>
<html>
<head>
    <title>CSS Units</title>
    <style>
        .box-px {
            width: 200px;
            height: 40px;
            background-color: lightblue;
        }

        .box-percent {
            width: 50%;
            height: 40px;
            background-color: lightgreen;
        }

        p {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <h1>CSS Units Example</h1>

    <div class="box-px">200px wide box</div>
    <br>

    <div class="box-percent">50% wide box</div>

    <p>This paragraph uses 1.5rem font size.</p>
</body>
</html>
