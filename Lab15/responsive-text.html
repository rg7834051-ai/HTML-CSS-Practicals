<!DOCTYPE html>
<html>
<head>
    <title>Responsive Text</title>

    <style>
        body {
            font-size: 1rem;
        }

        h1 {
            font-size: 1.5rem;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <h1>Responsive Text Design</h1>

    <p>
        This page demonstrates responsive text using rem units
        and CSS media queries.
    </p>

</body>
</html>
